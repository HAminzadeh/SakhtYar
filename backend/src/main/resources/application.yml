spring:
  application:
    name: sakhtyar-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sakhtyar}
    username: ${DB_USERNAME:sakhtyar}
    password: ${DB_PASSWORD:change-me-postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

  bootstrap-admin:
    username: ${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:ChangeMeNow_123!}
    display-name: ${APP_BOOTSTRAP_ADMIN_DISPLAY_NAME:مدیر سیستم}

  security:
    jwt:
      secret: ${APP_JWT_SECRET:change-this-development-jwt-secret-to-a-long-random-value-1234567890}
      expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:480}

  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:sakhtyar}
    secret-key: ${MINIO_SECRET_KEY:change-me-minio}
    bucket: ${MINIO_BUCKET:sakhtyar-documents}
