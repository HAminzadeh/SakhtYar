# Phase09: production cannot expose the simulation/test controllers.
app:
  database-migration:
    startup-enabled: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  bootstrap-admin:
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD}
    reset-password-on-startup: false
  security:
    jwt:
      secret: ${APP_JWT_SECRET}
    cookies:
      secure: true
      same-site: Strict
  storage:
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
  dev-seed:
    enabled: false
  quality:
    t10:
      require-restricted-runtime: true
    phase09:
      ui-preflight-enabled: false
spring:
  datasource:
    url: ${DB_URL}
    username: ${SAKHTYAR_RUNTIME_DB_USER}
    password: ${SAKHTYAR_RUNTIME_DB_PASSWORD}
  flyway:
    enabled: false  # schema migrations require a separate, approved deployment process
  jpa:
    hibernate:
      ddl-auto: validate

# Minimize production traces; keep request/query contents and PII out of span attributes.
management:
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_PROBABILITY:0.05}
