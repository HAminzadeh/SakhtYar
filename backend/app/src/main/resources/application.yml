spring:
  profiles:
    default: local

  application:
    name: sakhtyar-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sakhtyar}
    username: ${DB_USERNAME:sakhtyar}
    password: ${DB_PASSWORD:change-me-postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

  bootstrap-admin:
    username: ${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:ChangeMeNow_123!}
    display-name: ${APP_BOOTSTRAP_ADMIN_DISPLAY_NAME:Ù…Ø¯ÛŒØ± Ø³ÛŒØ³ØªÙ…}

  security:
    jwt:
      secret: ${APP_JWT_SECRET:change-this-development-jwt-secret-to-a-long-random-value-1234567890}
      access-expiration-minutes: ${APP_JWT_ACCESS_EXPIRATION_MINUTES:30}
    refresh:
      expiration-days: ${APP_REFRESH_EXPIRATION_DAYS:30}
    cookies:
      secure: ${APP_COOKIE_SECURE:false}
      same-site: ${APP_COOKIE_SAME_SITE:Strict}

  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:sakhtyar}
    secret-key: ${MINIO_SECRET_KEY:change-me-minio}
    bucket: ${MINIO_BUCKET:sakhtyar-documents}

  ai:
    enabled: ${SAKHTYAR_AI_ENABLED:true}
    provider: ${SAKHTYAR_AI_PROVIDER:ollama}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
      model: ${OLLAMA_MODEL:qwen3.5:4b}
      temperature: ${OLLAMA_TEMPERATURE:0.1}
      think: ${OLLAMA_THINK:false}
      timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:90}
      context-length: ${OLLAMA_CONTEXT_LENGTH:2048}
      max-predict-tokens: ${OLLAMA_MAX_PREDICT_TOKENS:128}
      num-batch: ${OLLAMA_NUM_BATCH:128}
      num-threads: ${OLLAMA_NUM_THREADS:0}
      use-mmap: ${OLLAMA_USE_MMAP:true}
      keep-alive: ${OLLAMA_KEEP_ALIVE:-1}
      structured-schema: ${OLLAMA_STRUCTURED_SCHEMA:true}
      num-parallel: ${OLLAMA_NUM_PARALLEL:1}
      max-loaded-models: ${OLLAMA_MAX_LOADED_MODELS:1}
      preload-model: ${OLLAMA_PRELOAD_MODEL:true}
      preload-timeout-seconds: ${OLLAMA_PRELOAD_TIMEOUT_SECONDS:120}
      auto-start: ${OLLAMA_AUTO_START:true}
      force-cpu: ${OLLAMA_FORCE_CPU:true}
      llm-library: ${OLLAMA_LLM_LIBRARY:cpu_avx2}
      no-cloud: ${OLLAMA_NO_CLOUD:true}
      stop-on-shutdown: ${OLLAMA_STOP_ON_SHUTDOWN:true}
      startup-timeout-seconds: ${OLLAMA_STARTUP_TIMEOUT_SECONDS:30}
      executable: ${OLLAMA_EXECUTABLE:}

  integrations:
    neshan:
      enabled: ${NESHAN_ENABLED:false}
      base-url: ${NESHAN_BASE_URL:https://api.neshan.org}
      service-api-key: ${NESHAN_SERVICE_API_KEY:}
      timeout-seconds: ${NESHAN_TIMEOUT_SECONDS:10}


logging:
  structured:
    format:
      console: ecs

