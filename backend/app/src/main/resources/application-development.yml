# Phase09: UI-driven Development. A profile is NOT a substitute for proven TEST isolation.
app:
  dev-seed:
    enabled: false
  quality:
    phase09:
      ui-preflight-enabled: true
spring:
  flyway:
    enabled: false  # no automatic schema mutation against the shared REAL/TEST database
  jpa:
    hibernate:
      ddl-auto: validate
# Restricted TEST login credentials, if explicitly provisioned, are read only for probe.
# Do not configure admin bootstrap or role changes from this profile.
