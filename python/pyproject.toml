[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sakhtyar-python"
version = "0.24.0"
description = "Independent Python runtime for SakhtYar document, OCR and intelligence workloads"
requires-python = ">=3.11"
dependencies = [
  "pymupdf",
  "python-docx",
  "python-pptx",
  "pytesseract"
]

[project.scripts]
sakhtyar-python = "sakhtyar_python.cli:main"

[tool.setuptools.packages.find]
where = ["src"]