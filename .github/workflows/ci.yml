name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test backend
        run: mvn --batch-mode test

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install
        run: npm install

      - name: Build
        run: npm run build


  compose:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate development compose
        run: docker compose config >/dev/null

      - name: Validate server compose
        env:
          SAKHTYAR_DOMAIN: example.com
          ACME_EMAIL: admin@example.com
          POSTGRES_DB: sakhtyar
          POSTGRES_USER: sakhtyar
          POSTGRES_PASSWORD: test-password
          REDIS_PASSWORD: test-redis
          MINIO_ROOT_USER: sakhtyar
          MINIO_ROOT_PASSWORD: test-minio-password
          MINIO_BUCKET: sakhtyar-documents
          APP_BOOTSTRAP_ADMIN_USERNAME: admin
          APP_BOOTSTRAP_ADMIN_PASSWORD: test-admin-password
          APP_BOOTSTRAP_ADMIN_DISPLAY_NAME: Admin
          APP_JWT_SECRET: a-very-long-test-jwt-secret-value-for-ci-only-1234567890
          GRAFANA_ADMIN_USER: admin
          GRAFANA_ADMIN_PASSWORD: test-grafana
        run: docker compose -f docker-compose.server.yml config >/dev/null
