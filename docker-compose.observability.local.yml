services:
  api:
    environment:
      SPRING_PROFILES_ACTIVE: local,api
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:5174
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      OLLAMA_AUTO_START: "false"
    ports:
      - "${LOCAL_API_PORT:-8080}:8080"
  minio:
    image: quay.io/minio/minio:latest
    ports:
      - "${LOCAL_MINIO_API_PORT:-9000}:9000"
      - "${LOCAL_MINIO_CONSOLE_PORT:-9001}:9001"
  redis:
    ports: ["${LOCAL_REDIS_PORT:-6379}:6379"]
  prometheus:
    ports: ["${LOCAL_PROMETHEUS_PORT:-9090}:9090"]
  grafana:
    ports: ["${LOCAL_GRAFANA_PORT:-3001}:3000"]
  loki:
    ports: ["${LOCAL_LOKI_PORT:-3100}:3100"]
  tempo:
    ports:
      - "${LOCAL_TEMPO_PORT:-3200}:3200"
      - "${LOCAL_OTLP_HTTP_PORT:-4318}:4318"



